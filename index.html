  function renderWrongFrequencyStats(records) {
  const wrongFreqList = document.getElementById("wrongFreqList")
  if (!wrongFreqList) return

  const wrongCounts = {}

  records.forEach(record => {
    if (!record.questions || !Array.isArray(record.questions)) return

    record.questions.forEach(question => {
      if (!question.isCorrect) {
        const freq = question.targetFrequency
        if (freq != null) {
          wrongCounts[freq] = (wrongCounts[freq] || 0) + 1
        }
      }
    })
  })

  const sorted = Object.entries(wrongCounts)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 5)

  if (sorted.length === 0) {
    wrongFreqList.innerText = "No missed frequency data yet."
    return
  }

  wrongFreqList.innerHTML = sorted
    .map(([freq, count], index) => {
      return `<div>${index + 1}. ${formatFreqLabel(Number(freq))}Hz — missed ${count} time${count > 1 ? "s" : ""}</div>`
    })
    .join("")
}

}
function getModeLabel(modeValue) {
  const modeMap = {
    1: "Sine Wave",
    2: "Pink Boost",
    3: "Pink Cut",
    4: "Pink Random",
    5: "Music Boost",
    6: "Music Cut",
    7: "Music Random"
  }
  return modeMap[modeValue] || `Mode ${modeValue}`
}

function getModeColor(modeValue) {
  const colorMap = {
    1: "#000000", // Sine Wave
    2: "#ff69b4", // Pink Boost base
    3: "#f59e0b", // Pink Cut base
    4: "#a855f7", // Pink Random base
    5: "#22c55e", // Music Boost base
    6: "#3b82f6", // Music Cut base
    7: "#8b4513"  // Music Random base
  }
  return colorMap[modeValue] || "#444"
}

function getDifficultyLabel(record) {
  if (record.mode === 1) return "Sine"

  if (record.gainMode === 9) return "Easy"
  if (record.gainMode === 6) return "Hard"

  return "Unknown"
}

function getDifficultyColor(modeValue, difficulty) {
  const colorMap = {
    1: {
      Sine: "#000000"
    },
    2: {
      Easy: "#ffb6d9", // Pink Boost Easy - 연한 분홍
      Hard: "#ff1493"  // Pink Boost Hard - 진한 분홍
    },
    3: {
      Easy: "#ffd84d", // Pink Cut Easy - 노랑
      Hard: "#ff8c00"  // Pink Cut Hard - 주황
    },
    4: {
      Easy: "#d8b4fe", // Pink Random Easy - 연한 보라
      Hard: "#7e22ce"  // Pink Random Hard - 진한 보라
    },
    5: {
      Easy: "#86efac", // Music Boost Easy - 연한 녹색
      Hard: "#15803d"  // Music Boost Hard - 진한 녹색
    },
    6: {
      Easy: "#93c5fd", // Music Cut Easy - 연한 파랑
      Hard: "#1d4ed8"  // Music Cut Hard - 진한 파랑
    },
    7: {
      Easy: "#8b4513", // Music Random Easy - 갈색
      Hard: "#8b0000"  // Music Random Hard - 진한 빨강
    }
  }

  return colorMap[modeValue]?.[difficulty] || getModeColor(modeValue)
}

function getRecordDateString(record) {
  const source =
    (record.finishedAt ? new Date(record.finishedAt) : null) ||
    (record.startedAt ? new Date(record.startedAt) : null) ||
    record.createdAt?.toDate?.() ||
    (record.createdAt?.seconds ? new Date(record.createdAt.seconds * 1000) : null)

  if (!source || Number.isNaN(source.getTime())) return "Unknown Date"

  const year = source.getFullYear()
  const month = String(source.getMonth() + 1).padStart(2, "0")
  const day = String(source.getDate()).padStart(2, "0")

  return `${year}-${month}-${day}`
}

function sortDateLabels(labels) {
  return [...labels].sort((a, b) => {
    if (a === "Unknown Date") return 1
    if (b === "Unknown Date") return -1
    return new Date(a) - new Date(b)
  })
}

function formatDateLabel(dateKey, useYear = false) {
  if (!dateKey || dateKey === "Unknown Date") return "Unknown Date"

  const [year, month, day] = dateKey.split("-").map(Number)
  if (!year || !month || !day) return dateKey

  return useYear ? `${year}/${month}/${day}` : `${month}/${day}`
}

function round1(value) {
  return Math.round(value * 10) / 10
}

function getQuestionDifficulty(question, record) {
  const resolvedGainMode = question?.gainMode ?? record?.gainMode

  if (record?.mode === 1) return "Sine"
  if (resolvedGainMode === 9) return "Easy"
  if (resolvedGainMode === 6) return "Hard"

  return null
}

function average(values) {
  if (!values.length) return 0
  return Math.round((values.reduce((sum, value) => sum + value, 0) / values.length) * 10) / 10
}

function getSeriesStyle(modeValue, difficulty) {
  return {
    borderColor: getDifficultyColor(modeValue, difficulty),
    backgroundColor: getDifficultyColor(modeValue, difficulty),
    borderDash: difficulty === "Easy" ? [6, 4] : [],
    tension: 0.25,
    spanGaps: true,
    pointRadius: 3,
    pointHoverRadius: 5
  }
}
  function renderGrowthChart(records) {
  const canvas = document.getElementById("growthChart")
  const summary = document.getElementById("statsSummary")
  const statsFilter = document.getElementById("statsFilter")
  

  if (!canvas || !summary || !statsFilter) return

  const filterValue = statsFilter.value || "allModes"

  if (growthChart) {
    growthChart.destroy()
  }

  if (!records || records.length === 0) {
    growthChart = new Chart(canvas, {
      type: "line",
      data: {
        labels: [],
        datasets: []
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        scales: {
          y: {
            beginAtZero: true,
            max: 100
          }
        }
      }
    })

    summary.innerHTML = "No saved training data yet."
    return
  }

  const seriesByDate = {}
  const seriesTotals = {}
  const overallByDate = {}
  const allDateKeys = new Set()

  function ensureSeries(seriesKey, dateKey) {
    if (!seriesByDate[seriesKey]) seriesByDate[seriesKey] = {}
    if (!seriesByDate[seriesKey][dateKey]) {
      seriesByDate[seriesKey][dateKey] = { total: 0, correct: 0 }
    }
    if (!seriesTotals[seriesKey]) {
      seriesTotals[seriesKey] = { total: 0, correct: 0 }
    }
  }

  function ensureOverall(dateKey) {
    if (!overallByDate[dateKey]) {
      overallByDate[dateKey] = { total: 0, correct: 0 }
    }
  }

  function addStat(seriesKey, dateKey, total, correct) {
    if (!total) return

    allDateKeys.add(dateKey)
    ensureSeries(seriesKey, dateKey)
    ensureOverall(dateKey)

    seriesByDate[seriesKey][dateKey].total += total
    seriesByDate[seriesKey][dateKey].correct += correct

    seriesTotals[seriesKey].total += total
    seriesTotals[seriesKey].correct += correct

    overallByDate[dateKey].total += total
    overallByDate[dateKey].correct += correct
  }

  records.forEach(record => {
    const dateKey = getRecordDateString(record)
    const questions = Array.isArray(record.questions) ? record.questions : []

    // 특정 모드: Sine Wave
    if (filterValue === "mode_1") {
      if (record.mode !== 1) return

      if (questions.length > 0) {
        let total = 0
        let correct = 0

        questions.forEach(question => {
          total += 1
          if (question.isCorrect) correct += 1
        })

        addStat("Sine Wave", dateKey, total, correct)
      } else {
        const total = Number(record.totalQuestions) || 0
        const correct = Number(record.correctAnswers) || 0
        addStat("Sine Wave", dateKey, total, correct)
      }

      return
    }

    // All modes: Sine 포함 + 나머지 모드 Easy/Hard 분리
    if (filterValue === "allModes") {
      if (record.mode === 1) {
        if (questions.length > 0) {
          let total = 0
          let correct = 0

          questions.forEach(question => {
            total += 1
            if (question.isCorrect) correct += 1
          })

          addStat("Sine Wave", dateKey, total, correct)
        } else {
          const total = Number(record.totalQuestions) || 0
          const correct = Number(record.correctAnswers) || 0
          addStat("Sine Wave", dateKey, total, correct)
        }

        return
      }

      if (questions.length > 0) {
        questions.forEach(question => {
          const difficulty = getQuestionDifficulty(question, record)
          if (!difficulty || difficulty === "Sine") return

          const seriesKey = `${getModeLabel(record.mode)} · ${difficulty}`
          addStat(seriesKey, dateKey, 1, question.isCorrect ? 1 : 0)
        })
      } else {
        const difficulty = getQuestionDifficulty(null, record)
        if (!difficulty || difficulty === "Sine") return

        const total = Number(record.totalQuestions) || 0
        const correct = Number(record.correctAnswers) || 0
        const seriesKey = `${getModeLabel(record.mode)} · ${difficulty}`

        addStat(seriesKey, dateKey, total, correct)
      }

      return
    }

    // 특정 모드(2~7): Easy / Hard 분리
    const selectedMode = Number(filterValue.replace("mode_", ""))
    if (record.mode !== selectedMode) return

    if (questions.length > 0) {
      questions.forEach(question => {
        const difficulty = getQuestionDifficulty(question, record)
        if (!difficulty || difficulty === "Sine") return

        addStat(difficulty, dateKey, 1, question.isCorrect ? 1 : 0)
      })
    } else {
      const difficulty = getQuestionDifficulty(null, record)
      if (!difficulty || difficulty === "Sine") return

      const total = Number(record.totalQuestions) || 0
      const correct = Number(record.correctAnswers) || 0

      addStat(difficulty, dateKey, total, correct)
    }
  })

  const labels = sortDateLabels([...allDateKeys])

  const containsMultipleYears = (() => {
    const years = new Set(
      labels
        .filter(dateKey => dateKey !== "Unknown Date")
        .map(dateKey => String(dateKey).slice(0, 4))
    )
    return years.size > 1
  })()

  let datasets = []

  if (filterValue === "mode_1") {
    datasets = [
  {
    label: "Sine Wave",
    data: labels.map(dateKey => {
      const stat = seriesByDate["Sine Wave"]?.[dateKey]
      if (!stat || !stat.total) return null
      return round1((stat.correct / stat.total) * 100)
    }),
    borderColor: getDifficultyColor(1, "Sine"),
    backgroundColor: getDifficultyColor(1, "Sine"),
    borderDash: [],
    tension: 0.25,
    spanGaps: true,
    pointRadius: 3,
    pointHoverRadius: 5
  }
]
  } else if (filterValue === "allModes") {
    const orderedSeries = [
      { label: "Sine Wave", mode: 1, difficulty: "Sine" },

      { label: "Pink Boost · Easy", mode: 2, difficulty: "Easy" },
      { label: "Pink Boost · Hard", mode: 2, difficulty: "Hard" },

      { label: "Pink Cut · Easy", mode: 3, difficulty: "Easy" },
      { label: "Pink Cut · Hard", mode: 3, difficulty: "Hard" },

      { label: "Pink Random · Easy", mode: 4, difficulty: "Easy" },
      { label: "Pink Random · Hard", mode: 4, difficulty: "Hard" },

      { label: "Music Boost · Easy", mode: 5, difficulty: "Easy" },
      { label: "Music Boost · Hard", mode: 5, difficulty: "Hard" },

      { label: "Music Cut · Easy", mode: 6, difficulty: "Easy" },
      { label: "Music Cut · Hard", mode: 6, difficulty: "Hard" },

      { label: "Music Random · Easy", mode: 7, difficulty: "Easy" },
      { label: "Music Random · Hard", mode: 7, difficulty: "Hard" }
    ]

    datasets = orderedSeries
  .map(item => {
    return {
      label: item.label,
      data: labels.map(dateKey => {
        const stat = seriesByDate[item.label]?.[dateKey]
        if (!stat || !stat.total) return null
        return round1((stat.correct / stat.total) * 100)
      }),
      borderColor: getDifficultyColor(item.mode, item.difficulty),
      backgroundColor: getDifficultyColor(item.mode, item.difficulty),
      borderDash: item.difficulty === "Easy" ? [6, 4] : [],
      tension: 0.25,
      spanGaps: true,
      pointRadius: 3,
      pointHoverRadius: 5
    }
  })
  .filter(dataset => dataset.data.some(value => value !== null))
  } else {
    const selectedMode = Number(filterValue.replace("mode_", ""))

    datasets = ["Easy", "Hard"]
  .map(difficulty => {
    return {
      label: difficulty,
      data: labels.map(dateKey => {
        const stat = seriesByDate[difficulty]?.[dateKey]
        if (!stat || !stat.total) return null
        return round1((stat.correct / stat.total) * 100)
      }),
      borderColor: getDifficultyColor(selectedMode, difficulty),
      backgroundColor: getDifficultyColor(selectedMode, difficulty),
      borderDash: difficulty === "Easy" ? [6, 4] : [],
      tension: 0.25,
      spanGaps: true,
      pointRadius: 3,
      pointHoverRadius: 5
    }
  })
  .filter(dataset => dataset.data.some(value => value !== null))
  }

growthChart = new Chart(canvas, {
  type: "line",
  data: {
    labels,
    datasets
  },
  options: {
    responsive: true,
    maintainAspectRatio: true,
    interaction: {
      mode: "nearest",
      intersect: false
    },
    plugins: {
      legend: {
  display: true,
  labels: {
    boxWidth: 22,
    boxHeight: 10,
    padding: 14,
    font: {
      size: 12,
      weight: "600"
    }
  }
},
      tooltip: {
        callbacks: {
          title(items) {
            if (!items || !items.length) return ""
            return formatDateLabel(items[0].label, containsMultipleYears)
          }
        }
      }
    },
    scales: {
      x: {
        ticks: {
          maxRotation: 45,
          minRotation: 0,
          callback: function(value) {
            const raw = this.getLabelForValue(value)
            return formatDateLabel(raw, containsMultipleYears)
          }
        }
      },
      y: {
        beginAtZero: true,
        max: 100,
        title: {
          display: true,
          text: "Accuracy (%)"
        }
      }
    }
  }
})

  const latestDateKey = labels.length ? labels[labels.length - 1] : null
  const latestDayStat = latestDateKey ? overallByDate[latestDateKey] : null

  const totalQuestionsAll = Object.values(overallByDate).reduce((sum, stat) => sum + stat.total, 0)
  const totalCorrectAll = Object.values(overallByDate).reduce((sum, stat) => sum + stat.correct, 0)

  // Best = 현재 보이는 시리즈들 중 최고 overall accuracy
  const visibleSeriesBestValues = Object.values(seriesTotals)
    .filter(stat => stat.total > 0)
    .map(stat => (stat.correct / stat.total) * 100)

  const best = visibleSeriesBestValues.length
    ? round1(Math.max(...visibleSeriesBestValues))
    : 0

  // Average = correct / total 백분율
  const avg = totalQuestionsAll
    ? round1((totalCorrectAll / totalQuestionsAll) * 100)
    : 0

  const showBestStat = filterValue === "allModes"

if (latestDayStat && latestDateKey) {
  const styledDate = `
    <span style="
      display:inline-block;
      margin-right:14px;
      padding:4px 10px;
      border-radius:999px;
      background:#f3f4f6;
      color:#374151;
      font-size:13px;
      font-weight:700;
      vertical-align:middle;
    ">
      ${formatDateLabel(latestDateKey, containsMultipleYears)}
    </span>
  `

  const statsParts = [
    `Total: ${latestDayStat.total}`,
    `Correct: ${latestDayStat.correct}`,
    ...(showBestStat ? [`Best: ${best}%`] : []),
    `Average: ${avg}%`
  ]

  const styledStats = `
    <span style="
      font-size:15px;
      font-weight:600;
      color:#222;
      vertical-align:middle;
    ">
      ${statsParts.join(`<span style="color:#999; padding:0 8px;">|</span>`)}
    </span>
  `

  summary.innerHTML = styledDate + styledStats
} else {
  const statsParts = [
    ...(showBestStat ? [`Best: ${best}%`] : []),
    `Average: ${avg}%`
  ]

  summary.innerHTML = `
    <span style="font-size:15px; font-weight:600; color:#222;">
      ${statsParts.join(`<span style="color:#999; padding:0 8px;">|</span>`)}
    </span>
  `
}
}
function getBaseVolumeGain() {
  return Number(volumeSlider.value) / 10
}

function getDimMultiplier() {
  return dimEnabled ? DIM_GAIN : 1
}

function getMuteMultiplier() {
  return muteEnabled ? 0 : 1
}

function applyMasterGain(extraDb = 0, immediate = false) {
  if (!masterGain || !audioContext) return

  const now = audioContext.currentTime
  const baseGain = getBaseVolumeGain()
  const extraGain = Math.pow(10, extraDb / 20)
  const finalGain = baseGain * getDimMultiplier() * getMuteMultiplier() * extraGain

  masterGain.gain.cancelScheduledValues(now)

  if (immediate) {
    masterGain.gain.setValueAtTime(finalGain, now)
  } else {
    masterGain.gain.setTargetAtTime(finalGain, now, 0.02)
  }
}

  async function loadTrainingRecordsFromFirestore() {
  const nicknameInput = document.getElementById("nicknameInput")
  const currentNickname =
    (playerNickname && playerNickname.trim()) ||
    (nicknameInput && nicknameInput.value ? nicknameInput.value.trim() : "")

  const statsFilter = document.getElementById("statsFilter")
  const filterValue = statsFilter ? statsFilter.value : "allModes"

    async function stopAllAudio() {
  if (!audioContext) return

  const oldSineGain = sineGain
  const oldSineOsc = sineOsc
  const oldFilterNode = filterNode
  const oldSourceNode = sourceNode

  const oldMusicSourceNode = musicSourceNode
  const oldMusicGain = musicGain
  const oldMusicFilterNode = musicFilterNode

  sineGain = null
  sineOsc = null
  filterNode = null
  sourceNode = null

  musicSourceNode = null
  musicGain = null
  musicFilterNode = null

  const now = audioContext.currentTime
  const fadeEnd = now + 0.03

  if (oldSineGain) {
    try {
      oldSineGain.gain.cancelScheduledValues(now)
      oldSineGain.gain.setValueAtTime(oldSineGain.gain.value, now)
      oldSineGain.gain.linearRampToValueAtTime(0, fadeEnd)
    } catch (e) {}
  }

  if (oldSineOsc) {
    try { oldSineOsc.stop(fadeEnd + 0.01) } catch (e) {}
  }

  if (oldSourceNode) {
    try { oldSourceNode.stop(now + 0.03) } catch (e) {}
  }

  if (oldMusicSourceNode) {
    try { oldMusicSourceNode.stop(now + 0.03) } catch (e) {}
  }

  setTimeout(() => {
    if (oldSineGain) {
      try { oldSineGain.disconnect() } catch (e) {}
    }
    if (oldFilterNode) {
      try { oldFilterNode.disconnect() } catch (e) {}
    }
    if (oldSourceNode) {
      try { oldSourceNode.disconnect() } catch (e) {}
    }

    if (oldMusicGain) {
      try { oldMusicGain.disconnect() } catch (e) {}
    }
    if (oldMusicFilterNode) {
      try { oldMusicFilterNode.disconnect() } catch (e) {}
    }
    if (oldMusicSourceNode) {
      try { oldMusicSourceNode.disconnect() } catch (e) {}
    }
  }, 80)
}

      osc.frequency.value = freq

      osc.connect(gain)
      gain.connect(masterGain)

      gain.gain.cancelScheduledValues(now)
      gain.gain.setValueAtTime(0, now)
      gain.gain.linearRampToValueAtTime(0.3, now + 0.05)
      gain.gain.setValueAtTime(0.3, now + 2.95)
      gain.gain.linearRampToValueAtTime(0, now + 3.00)

      osc.start(now)
      osc.stop(now + 3.03)

      sineOsc = osc
      sineGain = gain
    }

    async function replaySine() {
      if (mode !== 1) return
      if (!currentFrequency) return
      if (!await ensureAudioRunning()) return

      await stopAllAudio()
      await playSine(currentFrequency)
    }

    function createPinkNoise(ctx) {
      const bufferSize = 4096
      const pinkNoise = ctx.createScriptProcessor(bufferSize, 0, 1)

      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0

      pinkNoise.onaudioprocess = function (e) {
        const output = e.outputBuffer.getChannelData(0)

        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1

          b0 = 0.99886 * b0 + white * 0.0555179
          b1 = 0.99332 * b1 + white * 0.0750759
          b2 = 0.96900 * b2 + white * 0.1538520
          b3 = 0.86650 * b3 + white * 0.3104856
          b4 = 0.55000 * b4 + white * 0.5329522
          b5 = -0.7616 * b5 - white * 0.0168980

          output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.07
          b6 = white * 0.115926
        }
      }

      return pinkNoise
    }

    async function checkAnswer(freq, element) {
  if (!mode) return

  if (mode === 1) {
    await stopAllAudio()
    await playSine(freq)
  } else {
    if (!await ensureAudioRunning()) return
    if (audioContext) {
      if (filterNode) {
        filterNode.frequency.value = freq
        filterNode.gain.value = eqState ? boostAmount : 0
      }

      if (musicFilterNode) {
        musicFilterNode.frequency.value = freq
        musicFilterNode.gain.value = eqState ? boostAmount : 0
      }
    }
  }

  if (!questionAnswered) {
    totalQuestions++
    clearBands()

    const isCorrect = freq === currentFrequency
    const responseTimeMs = currentQuestionStartTime ? (Date.now() - currentQuestionStartTime) : null

    if (isCorrect) {
      correctAnswers++
      element.classList.add("correct")
      answerResultMessage = "Correct"
      resultText.innerText = answerResultMessage
      feedbackImg.src = "correct.png"
      feedbackImg.style.display = "block"
    } else {
      element.classList.add("wrong")
      highlightCorrect()
      answerResultMessage = "Wrong (" + formatFreqLabel(currentFrequency) + "Hz)"
      resultText.innerText = answerResultMessage
      feedbackImg.src = "wrong.png"
      feedbackImg.style.display = "block"
    }

    if (currentSessionRecord) {
      currentSessionRecord.questions.push({
        questionNumber: totalQuestions,
        mode: mode,
        level: level,
        gainMode: gainMode,
        targetFrequency: currentFrequency,
        selectedFrequency: freq,
        isCorrect: isCorrect,
        responseTimeMs: responseTimeMs,
        answeredAt: new Date().toISOString()
      })

      currentSessionRecord.totalQuestions = totalQuestions
      currentSessionRecord.correctAnswers = correctAnswers
      currentSessionRecord.accuracy =
        totalQuestions > 0
          ? Math.round((correctAnswers / totalQuestions) * 100)
          : 0
    }

    questionAnswered = true
    updateScore()
    console.log("currentSessionRecord:", currentSessionRecord)
    return
  }

  markPreviewSelection(freq)

  if (answerResultMessage) {
  resultText.innerText = answerResultMessage + " | Preview: " + formatFreqLabel(freq) + "Hz"
} else {
  resultText.innerText = "Preview: " + formatFreqLabel(freq) + "Hz"
}
}

    function clearBands() {
  document.querySelectorAll(".eq-band").forEach(b => {
    b.classList.remove("correct", "wrong", "preview-selected")
  })
  previewSelectedFreq = null
}

    function highlightCorrect() {
      document.querySelectorAll(".eq-band").forEach(b => {
        if (parseFloat(b.dataset.freq) === currentFrequency) {
          b.classList.add("correct")
        }
      })
    }

    function updateBandDisplay() {
      document.querySelectorAll(".eq-band").forEach(b => {

        if (activeFreqs.includes(f)) {

        } else {
          b.classList.add("disabled")
        }
      })
    }

    function updateModeButtons() {
      document.querySelectorAll(".mode-btn").forEach(btn => {
        if (parseInt(btn.dataset.mode) === mode) {

        } else {

    }
  })
}
    
function updateTransportButtons() {

function updateEQSwitch() {

function toggleEQ() {

  if (filterNode) {

}

    function updateScore() {
  const scoreEl = document.getElementById("score")
  if (!scoreEl) return

  if (!currentSessionRecord || !Array.isArray(currentSessionRecord.questions)) {
    scoreEl.innerText = "Score: 0 / 0 (0%)"
    return
  }

  const questions = currentSessionRecord.questions

  if (mode === 1) {
    let total = questions.length
    let correct = questions.filter(q => q.isCorrect).length
    const percent = total > 0 ? Math.round((correct / total) * 100) : 0

    scoreEl.innerText = `Score: ${correct} / ${total} (${percent}%)`
    return
  }

  const easyQuestions = questions.filter(q => q.gainMode === 9)
  const hardQuestions = questions.filter(q => q.gainMode === 6)

  const easyCorrect = easyQuestions.filter(q => q.isCorrect).length
  const hardCorrect = hardQuestions.filter(q => q.isCorrect).length

  const easyPercent =
    easyQuestions.length > 0
      ? Math.round((easyCorrect / easyQuestions.length) * 100)
      : 0

  const hardPercent =
    hardQuestions.length > 0
      ? Math.round((hardCorrect / hardQuestions.length) * 100)
      : 0

  scoreEl.innerText =
    `Easy: ${easyCorrect} / ${easyQuestions.length} (${easyPercent}%)\n` +
    `Hard: ${hardCorrect} / ${hardQuestions.length} (${hardPercent}%)`
}

  <script> 

  
    let eqState = true
let pinkIsPlaying = false
    function updateEQButtonState() {
  const eqOnBtn = document.getElementById("eqOnBtn")
  const eqOffBtn = document.getElementById("eqOffBtn")

  if (!eqOnBtn || !eqOffBtn) return

  if (eqState) {
    eqOnBtn.classList.remove("inactive")
    eqOffBtn.classList.add("inactive")
  } else {
    eqOnBtn.classList.add("inactive")
    eqOffBtn.classList.remove("inactive")
  }
}

    const feedbackImg = document.getElementById("feedbackImg")
    const musicUploadArea = document.getElementById("musicUploadArea")
const musicFileInput = document.getElementById("musicFileInput")
const musicFileName = document.getElementById("musicFileName")

    let audioContext = null
    let masterGain = null

    let audioReady = false

    const freq13 = [
  20,25,31.5,40,50,63,80,100,125,160,
  200,250,315,400,500,630,800,1000,1250,1600,
  2000,2500,3150,4000,5000,6300,8000,10000,12500,16000,20000
]

const freq23 = [
  25,40,63,100,160,250,400,630,
  1000,1600,2500,4000,6300,10000,16000
]

const freqOct = [31.5,63,125,250,500,1000,2000,4000,8000,16000]

    let level = 3
    let activeFreqs = freq13

    let mode = null
    let currentFrequency = null
    let boostAmount = 12
    let gainMode = 9

    let sourceNode = null
    let filterNode = null

    let sineOsc = null
    let sineGain = null
    let musicSourceNode = null
let musicGain = null
let musicFilterNode = null

    let questionAnswered = false
let playerNickname = ""
let playerCategory = ""
let playerCharacter = ""
let trainingStarted = false
    let totalQuestions = 0
    let correctAnswers = 0
    let hasStarted = false

const STORAGE_CHARACTER_KEY = "listen_frequency_character"
    const STORAGE_NICKNAME_KEY = "listen_frequency_nickname"
const STORAGE_CATEGORY_KEY = "listen_frequency_category"
let uploadedAudioBuffer = null
let uploadedAudioName = ""
const characters = [
  { id: "golden", name: "Golden", file: "characters/golden_trumpet.png" },
  { id: "trex", name: "T-Rex", file: "characters/trex_drums.png" },
  { id: "munchkin", name: "Munchkin", file: "characters/munchkin_keyboard.png" },
  { id: "bear", name: "Bear", file: "characters/brown_bear_boombox.png" },
  { id: "lion", name: "Lion", file: "characters/lion_conductor.png" },
  { id: "dolphin", name: "Dolphin", file: "characters/dolphin_mic.png" },
  { id: "penguin", name: "Penguin", file: "characters/penguin_headphones.png" },
  { id: "honeybadger", name: "Honey Badger", file: "characters/honeybadger_guitar.png" }
]

function savePlayerProfile() {
  localStorage.setItem(STORAGE_NICKNAME_KEY, playerNickname)
  localStorage.setItem(STORAGE_CATEGORY_KEY, playerCategory)
  localStorage.setItem(STORAGE_CHARACTER_KEY, playerCharacter)
}
function loadPlayerProfile() {
  const savedNickname = localStorage.getItem(STORAGE_NICKNAME_KEY) || ""
  const savedCategory = localStorage.getItem(STORAGE_CATEGORY_KEY) || ""
  const savedCharacter = localStorage.getItem(STORAGE_CHARACTER_KEY) || ""

  if (savedNickname) {
    playerNickname = savedNickname
    const nicknameInput = document.getElementById("nicknameInput")
    if (nicknameInput) {
      nicknameInput.value = playerNickname
    }
  }

  if (savedCategory) {
    playerCategory = savedCategory
    selectCategory(playerCategory)
  }

  if (savedCharacter) {
    playerCharacter = savedCharacter
    selectCharacter(playerCharacter)
  }
}
    async function startTraining() {
  const nicknameInput = document.getElementById("nicknameInput")
  const introGuide = document.getElementById("introGuide")
  const introScreen = document.getElementById("introScreen")
  const trainingPanel = document.getElementById("trainingPanel")
  const playerBadge = document.getElementById("playerBadge")

  const nickname = nicknameInput.value.trim()

  if (!nickname) {
    introGuide.innerText = "Please enter your nickname."
    return
  }

  if (!playerCategory) {
    introGuide.innerText = "Please choose your category."
    return
  }
if (!playerCharacter) {
  introGuide.innerText = "Please choose your character."
  return
}
  let webAudioOk = false

  try {
    webAudioOk = await initAudio()
  } catch (err) {
    console.error("initAudio failed:", err)
  }

  if (!webAudioOk) {
    introGuide.innerText = "Audio could not be started. Please try again."
    return
  }

  playerNickname = nickname
  trainingStarted = true
  audioReady = true

  savePlayerProfile()

  const playerBadgeImg = document.getElementById("playerBadgeImg")
const playerBadgeName = document.getElementById("playerBadgeName")
const selectedCharacter = characters.find(character => character.id === playerCharacter)

if (selectedCharacter && playerBadgeImg) {
  playerBadgeImg.src = selectedCharacter.file
}

if (playerBadgeName) {
  playerBadgeName.innerText = playerNickname
}

playerBadge.style.display = "flex"

  introScreen.style.display = "none"
  trainingPanel.style.display = "block"

  resultText.innerText = "Choose a mode, then press Start."
}

function selectCategory(category) {
  playerCategory = category

  document.querySelectorAll(".category-btn").forEach(btn => {
    if (btn.dataset.category === category) {
      btn.classList.remove("inactive")
    } else {
      btn.classList.add("inactive")
    }
  })
}

function renderCharacterCards() {
  const characterGrid = document.getElementById("characterGrid")
  if (!characterGrid) return

  characterGrid.innerHTML = characters.map(character => `
  <div class="character-card ${playerCharacter === character.id ? "selected" : ""} ${playerCharacter && playerCharacter !== character.id ? "inactive" : ""}"
       data-character-id="${character.id}"
       onclick="selectCharacter('${character.id}')">
    <img src="${character.file}" alt="${character.name}">
  </div>
`).join("")
}

function selectCharacter(characterId) {
  playerCharacter = characterId
  renderCharacterCards()
}

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms))
    }

    function createContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)()
        masterGain = audioContext.createGain()

        const vol = volumeSlider.value / 10
        masterGain.gain.setValueAtTime(vol, audioContext.currentTime)
        masterGain.connect(audioContext.destination)
      }
    }

    async function ensureAudioRunning() {
      createContext()

      try {
        if (audioContext.state === "suspended" || audioContext.state === "interrupted") {
          await audioContext.resume()
        }
      } catch (e) {
        console.error("Audio resume failed:", e)
      }

      audioReady = !!(audioContext && audioContext.state === "running")
      console.log("audio state:", audioContext ? audioContext.state : "no context")

      return audioReady
    }

    async function initAudio() {
      createContext()

      try {
        await ensureAudioRunning()

        const buffer = audioContext.createBuffer(1, 1, audioContext.sampleRate)
        const source = audioContext.createBufferSource()
        source.buffer = buffer
        source.connect(masterGain)
        source.start(0)

        audioReady = (audioContext.state === "running")
        console.log("audio init ok:", audioContext.state)
      } catch (e) {
        console.error("Audio init failed:", e)
        audioReady = false
      }

      return audioReady
    }

    volumeSlider.oninput = function () {
      volumeValue.innerText = this.value

      if (masterGain && audioContext) {
        const now = audioContext.currentTime
        const target = this.value / 10
        masterGain.gain.setTargetAtTime(target, now, 0.02)
      }
    }

    async function stopAllAudio() {
  if (!audioContext) return

  const oldSineGain = sineGain
  const oldSineOsc = sineOsc
  const oldFilterNode = filterNode
  const oldSourceNode = sourceNode

  const oldMusicSourceNode = musicSourceNode
  const oldMusicGain = musicGain
  const oldMusicFilterNode = musicFilterNode

  sineGain = null
  sineOsc = null
  filterNode = null
  sourceNode = null

  musicSourceNode = null
  musicGain = null
  musicFilterNode = null

  const now = audioContext.currentTime
  const fadeEnd = now + 0.03

  if (oldSineGain) {
    try {
      oldSineGain.gain.cancelScheduledValues(now)
      oldSineGain.gain.setValueAtTime(oldSineGain.gain.value, now)
      oldSineGain.gain.linearRampToValueAtTime(0, fadeEnd)
    } catch (e) {}
  }

  if (oldSineOsc) {
    try { oldSineOsc.stop(fadeEnd + 0.01) } catch (e) {}
  }

  if (oldSourceNode) {
    try { oldSourceNode.stop(now + 0.03) } catch (e) {}
  }

  if (oldMusicSourceNode) {
    try { oldMusicSourceNode.stop(now + 0.03) } catch (e) {}
  }

  setTimeout(() => {
    if (oldSineGain) {
      try { oldSineGain.disconnect() } catch (e) {}
    }
    if (oldFilterNode) {
      try { oldFilterNode.disconnect() } catch (e) {}
    }
    if (oldSourceNode) {
      try { oldSourceNode.disconnect() } catch (e) {}
    }

    if (oldMusicGain) {
      try { oldMusicGain.disconnect() } catch (e) {}
    }
    if (oldMusicFilterNode) {
      try { oldMusicFilterNode.disconnect() } catch (e) {}
    }
    if (oldMusicSourceNode) {
      try { oldMusicSourceNode.disconnect() } catch (e) {}
    }
  }, 80)
}

    async function playSine(freq) {
      createContext()

      const now = audioContext.currentTime
      const osc = audioContext.createOscillator()
      const gain = audioContext.createGain()

      osc.type = "sine"
      osc.frequency.value = freq

      osc.connect(gain)
      gain.connect(masterGain)

      gain.gain.cancelScheduledValues(now)
      gain.gain.setValueAtTime(0, now)
      gain.gain.linearRampToValueAtTime(0.3, now + 0.05)
      gain.gain.setValueAtTime(0.3, now + 2.95)
      gain.gain.linearRampToValueAtTime(0, now + 3.00)

      osc.start(now)
      osc.stop(now + 3.03)

      sineOsc = osc
      sineGain = gain
    }

    function createPinkNoise(ctx) {
      const bufferSize = 4096
      const pinkNoise = ctx.createScriptProcessor(bufferSize, 0, 1)

      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0

      pinkNoise.onaudioprocess = function (e) {
        const output = e.outputBuffer.getChannelData(0)

        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1

          b0 = 0.99886 * b0 + white * 0.0555179
          b1 = 0.99332 * b1 + white * 0.0750759
          b2 = 0.96900 * b2 + white * 0.1538520
          b3 = 0.86650 * b3 + white * 0.3104856
          b4 = 0.55000 * b4 + white * 0.5329522
          b5 = -0.7616 * b5 - white * 0.0168980

          output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.07
          b6 = white * 0.115926
        }
      }

      return pinkNoise
    }
